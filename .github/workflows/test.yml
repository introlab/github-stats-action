name: Test

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Stats
        uses: ./
        with:
          github-stats-token: ${{ secrets.STATS_TOKEN }}
          google-application-credentials: ${{ secrets.GOODLE_APPLICATION_CREDENTIALS }}
          spreadsheet-id: ${{ secrets.SPREADSHEET_ID }}
